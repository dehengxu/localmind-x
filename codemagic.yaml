# Codemagic CI/CD — LocalMind X（Flutter iOS → TestFlight）
# 控制台逐条操作清单见 docs/codemagic-testflight.md（改控制台前先读那份）
#
# ── 构建源：自建 Gitea（正本）────────────────────────────────────────────
#   Repository URL（SSH）  ：git@git.headwindx.top:one/localmind-x.git
#   Repository URL（HTTPS）：https://code.headwindx.top/one/localmind-x.git
#   接入方式：Codemagic → Add application → HTTPS/SSH → Generate key pair
#             → 把 Codemagic 给的**公钥**加到 Gitea 仓库 Settings → Deploy Keys
#   自动触发：Gitea 仓库 → Settings → Webhooks → Target URL = 从 Codemagic 应用设置 → Webhooks
#             复制的 payload URL（官方口径：SSH/HTTPS 接入的仓库必须手配 webhook；不要自己拼 URL）
#             Gitea 推任何分支都会带 GitHub 兼容头 X-GitHub-Event: push，Codemagic 认这个头 → push 可触发
#   触发分支：docs/gitea-repo-live —— 本仓 CI 配置所在分支。
#             2026-11-22 Henry 决定：LocalMind X 独立发展、不回流上游，main 冻结在 bb564e6 不再动。
#             所以触发分支不再是 main：main 上仍是旧 yaml（LocalMind ASC API Key / $FCI_BUILD_DIR /
#             flutter 3.44.0，无 use-profiles / ios_signing），按 main 构建必失败。
#             将来 Henry 指定长期主干分支时，只需要改下面 branch_patterns 那一行。
#   兜底    ：控制台手动 Start build / Builds API
#   GitHub 的 dehengxu/localmind-x 降级为只读备份，不再是构建源。
#   仓库状态：one/localmind-x 已建好（私有，默认分支 main，2026-11-22），GitHub 侧内容已全量
#             推送（2026-11-22 23:15 实测：11 分支 + 30 tag；分支数随 CI/文档分支增减，
#             以 `git ls-remote --heads` 为准）。现在缺的只有 Codemagic 侧两步：
#             Deploy Key + webhook。
#
# ── 三处「名字」必须与控制台完全一致（大小写敏感），对不上构建直接失败 ──
#   1) integrations.app_store_connect: App Manager
#      依据：one/ToMobileScreen（同一个 Codemagic 账号、同一个 Apple 团队）master 分支的
#            codemagic.yaml 里写的就是 App Manager（2026-11-22 从 code.headwindx.top 核对）。
#      控制台位置：Team settings → Integrations → Developer Portal → 「App Store Connect API key name」。
#      若控制台里没有这个名字，两条路二选一：
#        ① Henry 新建一条 ASC API Key 集成，名字一字不差地写 App Manager；
#        ② 改用别的名字，同时把下面这一行改成同一个名字。
#      两边同名是硬要求，控制台改名后本行必须同步改。
#      （ASC 侧那条 API Key 的「角色」也必须是 App Manager —— 那是权限位，与这里的集成名是两回事。）
#   2) publishing.app_store_connect.beta_groups: Internal Testers
#      = App Store Connect → TestFlight → 内部测试组的名字
#   3) environment.ios_signing.bundle_identifier: top.headwindx.localmind
#      = Apple Developer Portal 里注册的 App ID
#
# 需要你（Henry）在 Codemagic 应用设置 → Environment variables 里自己加的（都可留空，留空走降级路径）：
#   XCODE_TEAM_ID      = 你的 10 位 Apple Team ID（Apple Developer Portal → Membership details）
#   APP_STORE_APPLE_ID = App Store Connect 里 LocalMind X 的数字 Apple ID（纯数字，用于查 ASC 上的最新构建号）
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90

    # 触发源 = Gitea 仓库的 push webhook（配法见 docs/codemagic-testflight.md §2.3）。
    # Gitea 侧还没配 webhook 时，可在控制台手动 Start build 跑同一条流水线。
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: docs/gitea-repo-live
          include: true
          source: true

    integrations:
      app_store_connect: App Manager

    environment:
      # 3.44.2 = 仓库根 .fvmrc 锁定的版本（Flutter 3.44.2 / Dart 3.12.2，2026-06-10 发布）
      flutter: 3.44.2
      xcode: latest
      cocoapods: default
      # 从 App Store Connect 集成里取签名证书 + 描述文件（bundle id 必须与 App ID 一致）
      ios_signing:
        distribution_type: app_store
        bundle_identifier: top.headwindx.localmind
      # Codemagic 控制台里的环境变量组（含 ASC 凭据 APP_STORE_CONNECT_*），用来查 ASC 上的最新构建号。
      # 账号里没有名为 app_store 的组 → 删掉这两行，构建号自动退回 PROJECT_BUILD_NUMBER。
      groups:
        - app_store

    cache:
      cache_paths:
        - ~/.pub-cache

    scripts:
      # pbxproj 里 DEVELOPMENT_TEAM 是空占位（见 docs/codemagic-testflight.md）。
      # 配了 XCODE_TEAM_ID 就覆盖成你的 Team ID；没配就跳过，签名团队由下面的 use-profiles 按签名文件决定。
      - name: Override Xcode development team
        script: |
          set -e
          if [ -z "$XCODE_TEAM_ID" ]; then
            echo "::warning::未设置 XCODE_TEAM_ID，跳过团队覆盖；签名团队将由 xcode-project use-profiles 按 App Store Connect 集成里的证书/描述文件决定"
          else
            echo "$XCODE_TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$' || {
              echo "::error::XCODE_TEAM_ID 必须是 10 位字母数字（例：ABCDE12345），当前值不合法"
              exit 1
            }
            # macOS 自带 BSD sed（-i ''），GNU sed 写法不同，这里两种都兼容
            if sed --version >/dev/null 2>&1; then
              SED_I="sed -i"
            else
              SED_I="sed -i ''"
            fi
            $SED_I -E "s/DEVELOPMENT_TEAM = [A-Za-z0-9]*(\"[A-Za-z0-9]*\")?/DEVELOPMENT_TEAM = $XCODE_TEAM_ID/g" \
              ios/Runner.xcodeproj/project.pbxproj
            grep -q "DEVELOPMENT_TEAM = $XCODE_TEAM_ID;" ios/Runner.xcodeproj/project.pbxproj || {
              echo "::error::DEVELOPMENT_TEAM 覆盖失败，请检查 project.pbxproj 里的写法"
              exit 1
            }
            echo "DEVELOPMENT_TEAM overridden to $XCODE_TEAM_ID"
          fi

      # 用 App Store Connect 集成里的证书 + 描述文件配置 Xcode 签名（这一步也会把签名团队写回工程）
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;

      # 构建号（CFBundleVersion）必须严格大于 App Store Connect 上已上传的最大号，否则被 Apple 拒收。
      # 取多个来源的较大值，再 +1（宁可跳号，也不要撞号）：
      #   a) PROJECT_BUILD_NUMBER —— Codemagic 的项目级计数（只在 Codemagic 内单调递增）
      #   b) ASC 上该 app 已用过的最大构建号 —— 需要 APP_STORE_APPLE_ID + 环境变量组 app_store
      #      三个命令都查一遍取最大值：
      #        get-latest-app-store-build-number（参考项目 one/ToMobileScreen 在用）
      #        get-latest-build-number（跨 TestFlight/App Store 的最高号）
      #        get-latest-testflight-build-number
      #   c) pubspec.yaml 里 version 的 build 号 + 1 —— 防止首次构建号低于手工上传过的号
      # 不用 agvtool：Flutter 项目用 flutter build ipa --build-number 写 CFBundleVersion。
      - name: Build IPA
        script: |
          set -e
          BUILD_NUMBER="${PROJECT_BUILD_NUMBER:-0}"
          PUBSPEC_BUILD=$(sed -nE 's/^version:.*\+([0-9]+).*/\1/p' pubspec.yaml | head -1)
          if [ -n "$PUBSPEC_BUILD" ] && [ "$PUBSPEC_BUILD" -ge "$BUILD_NUMBER" ]; then
            BUILD_NUMBER=$((PUBSPEC_BUILD + 1))
          fi
          if [ "$BUILD_NUMBER" -lt 1 ]; then
            echo "::error::构建号无法确定（PROJECT_BUILD_NUMBER 未设置，且 pubspec version 不可用）"
            exit 1
          fi
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=0
            FOUND=0
            for CMD in get-latest-app-store-build-number get-latest-build-number get-latest-testflight-build-number; do
              if OUT=$(app-store-connect "$CMD" "$APP_STORE_APPLE_ID" 2>&1) && echo "$OUT" | grep -Eq '^[0-9]+$'; then
                FOUND=1
                echo "ASC $CMD = $OUT"
                if [ "$OUT" -gt "$LATEST" ]; then
                  LATEST=$OUT
                fi
              else
                echo "::notice::命令 $CMD 未返回纯数字构建号（输出：$(echo "$OUT" | tr '\n' ' ' | cut -c1-120)）"
              fi
            done
            if [ "$FOUND" = "1" ]; then
              if [ "$LATEST" -ge "$BUILD_NUMBER" ]; then
                BUILD_NUMBER=$((LATEST + 1))
              fi
            else
              echo "::warning::取 ASC 最新构建号失败（app=$APP_STORE_APPLE_ID），沿用当前号 $BUILD_NUMBER"
            fi
          else
            echo "::warning::未设置 APP_STORE_APPLE_ID，构建号只按 Codemagic 计数与 pubspec 推导；若 ASC 上已有更大的号会被拒收"
          fi
          echo "CFBundleVersion = $BUILD_NUMBER"

          # ── 导出配置（ExportOptions.plist）：确定性选取，绝不静默退回不完整的文件 ──
          # 1) 首选 xcode-project use-profiles 生成的官方文件：
          #    cli-tools 的 use-profiles 默认把生成的导出配置写到 $HOME/export_options.plist
          #    （Codemagic 构建机上 = /Users/builder/export_options.plist），
          #    Codemagic 官方 Flutter 示例用的就是这个路径。
          # 2) 其次 $CM_BUILD_DIR/export_options.plist。
          # 3) 都没有 → 用 $XCODE_TEAM_ID + 已安装的描述文件现场生成一份完整配置。
          # 4) 仍拿不到 → ::error:: 退出（不猜、不编造描述文件名）。
          # 明确不做的事：不退回仓库里的 ios/ExportOptions.plist —— 那份只有
          # method / signingStyle / destination 三个键，没有 teamID、没有 provisioningProfiles，
          # 静默用它会在 xcodebuild 导出阶段才炸，失败点离根因很远；
          # 而且它的 destination=upload 会让 xcodebuild 先上传一次，
          # 之后 Codemagic 的 submit_to_testflight 再传同一个 build 号 → 重复上传被 Apple 拒。
          EXPORT_OPTIONS=""
          for CAND in "$HOME/export_options.plist" /Users/builder/export_options.plist "${CM_BUILD_DIR:-/tmp}/export_options.plist"; do
            if [ -f "$CAND" ] && grep -q "<key>method</key>" "$CAND"; then
              EXPORT_OPTIONS="$CAND"
              break
            fi
          done
          if [ -n "$EXPORT_OPTIONS" ]; then
            echo "export options = $EXPORT_OPTIONS (来源：xcode-project use-profiles 生成)"
          else
            echo "::notice::use-profiles 没有生成导出配置，改为运行时生成一份完整配置"
            TEAM_ID="${XCODE_TEAM_ID:-}"
            PROFILE_NAME=""
            # 描述文件名：先看 use-profiles 是否把 PROVISIONING_PROFILE_SPECIFIER 写进了工程
            if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
              PROFILE_NAME=$(grep -m1 -E 'PROVISIONING_PROFILE_SPECIFIER = "?[^";]+"?' ios/Runner.xcodeproj/project.pbxproj \
                | sed -E 's/.*= "?([^";]+)"?;?.*/\1/')
            fi
            # 再从已安装的描述文件里找 bundle id 匹配的那一个（macOS 的 security cms 解出 Name）
            if [ -z "$PROFILE_NAME" ] && command -v security >/dev/null 2>&1; then
              for P in "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"/*.mobileprovision; do
                [ -f "$P" ] || continue
                PROFILE_XML=$(security cms -D -i "$P" 2>/dev/null) || continue
                printf '%s' "$PROFILE_XML" | grep -q "top.headwindx.localmind" || continue
                PROFILE_NAME=$(printf '%s' "$PROFILE_XML" | sed -nE 's:.*<key>Name</key>[[:space:]]*<string>([^<]*)</string>.*:\1:p' | head -1)
                if [ -n "$PROFILE_NAME" ]; then
                  break
                fi
              done
            fi
            if ! printf '%s' "$TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
              echo "export options = (none) —— 没有可用的导出配置，构建到此终止"
              echo "::error::use-profiles 没有生成导出配置，且 XCODE_TEAM_ID 未设置或不是 10 位字母数字，无法生成完整导出配置"
              echo "::error::下一步：① 看 use-profiles 那一步的日志（integrations.app_store_connect 的集成名要和控制台一致）；② 在 Codemagic 应用设置里补 XCODE_TEAM_ID（10 位 Team ID）"
              exit 1
            fi
            if [ -z "$PROFILE_NAME" ]; then
              echo "export options = (none) —— 没有可用的导出配置，构建到此终止"
              echo "::error::use-profiles 没有生成导出配置，且已安装的描述文件里找不到 bundle id 为 top.headwindx.localmind 的 App Store 描述文件，无法生成完整导出配置"
              echo "::error::下一步：① 确认 integrations.app_store_connect 指向的集成在控制台存在；② 确认 environment.ios_signing.bundle_identifier 与已注册的 App ID 一致；③ 确认 App ID 已勾选 Push Notifications 后重跑构建"
              exit 1
            fi
            GENERATED="${CM_BUILD_DIR:-/tmp}/export_options.generated.plist"
            cat > "$GENERATED" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>top.headwindx.localmind</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
            EXPORT_OPTIONS="$GENERATED"
            echo "export options = $EXPORT_OPTIONS (运行时生成：teamID=$TEAM_ID, provisioningProfile=$PROFILE_NAME)"
          fi

          flutter build ipa \
            --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist="$EXPORT_OPTIONS"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # 必须与 App Store Connect → TestFlight 里的内部测试组同名
        beta_groups:
          - Internal Testers
